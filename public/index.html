<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DN Ad Preview</title>
<script>
  // theme ก่อน paint: ค่าที่เลือกไว้ หรือตามระบบ
  (function(){ var t; try { t = localStorage.getItem('dnap-theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t; })();
</script>
<style>
  :root {
    --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f0f2f5; --ink:#0f1115; --mute:#667085; --line:#e4e7ec;
    --acc:#e11d48; --acc-ink:#fff; --acc-soft:rgba(225,29,72,.08); --ok:#12b76a; --warn-bg:#fef3c7; --warn-ink:#92400e;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.06); --radius:14px;
    --dev-d:#2563eb; --dev-m:#7c3aed;
  }
  [data-theme=dark] {
    --bg:#0b0d12; --surface:#141821; --surface-2:#1b2030; --ink:#e7e9ee; --mute:#8b93a7; --line:#262c3a;
    --acc:#fb7185; --acc-ink:#1b0a0f; --acc-soft:rgba(251,113,133,.12); --warn-bg:#3a2a0a; --warn-ink:#fcd34d;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); --dev-d:#60a5fa; --dev-m:#a78bfa;
  }
  * { box-sizing:border-box; }
  html { color-scheme: light dark; }
  body { margin:0; font:15px/1.55 "Sarabun","Noto Sans Thai","IBM Plex Sans Thai",system-ui,sans-serif; background:var(--bg); color:var(--ink); transition:background .2s,color .2s; }
  header { display:flex; align-items:center; gap:14px; padding:12px 24px; position:sticky; top:0; z-index:5;
    background:color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px; letter-spacing:-.01em; }
  .logo { width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,var(--acc),#f97316); display:grid; place-items:center; color:#fff; font-size:13px; font-weight:800; }
  header .sp { flex:1; } #meta { color:var(--mute); font-size:13px; }
  button { font:inherit; font-size:14px; cursor:pointer; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:10px; padding:7px 14px; transition:background .15s, border-color .15s, transform .05s; }
  button:hover:not(:disabled) { background:var(--surface-2); }
  button:active:not(:disabled) { transform:translateY(1px); }
  button.pri { background:var(--acc); color:var(--acc-ink); border-color:transparent; font-weight:600; }
  button.pri:hover:not(:disabled) { background:var(--acc); filter:brightness(1.07); }
  button.ghost { border-color:transparent; background:transparent; color:var(--mute); padding:6px 10px; }
  button:disabled { opacity:.45; cursor:default; }
  .icon { width:36px; height:36px; padding:0; display:grid; place-items:center; font-size:16px; }
  main { display:grid; grid-template-columns:1fr 380px; gap:24px; padding:24px; max-width:1440px; margin:0 auto; }
  @media (max-width:960px) { main { grid-template-columns:1fr; } aside .panel { position:static !important; } }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
  aside .panel { position:sticky; top:84px; max-height:calc(100vh - 108px); overflow:auto; }
  .step { display:flex; align-items:center; gap:10px; font-size:15px; font-weight:600; margin:18px 0 10px; }
  .step:first-child { margin-top:0; }
  .num { width:22px; height:22px; border-radius:50%; background:var(--acc-soft); color:var(--acc); display:grid; place-items:center; font-size:12px; font-weight:700; }
  .count { margin-left:auto; font-size:12px; font-weight:600; background:var(--surface-2); color:var(--mute); padding:2px 9px; border-radius:99px; }
  .count.on { background:var(--acc); color:var(--acc-ink); }
  input[type=search], textarea, input[type=password] { width:100%; font:inherit; color:var(--ink); background:var(--surface); padding:10px 14px;
    border:1px solid var(--line); border-radius:10px; outline:none; transition:border-color .15s, box-shadow .15s; }
  input:focus, textarea:focus, select:focus { border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-soft); }
  .search { position:sticky; top:72px; z-index:4; padding-bottom:6px; background:linear-gradient(var(--bg) 80%, transparent); }
  .adv { margin:26px 0 10px; font-weight:700; font-size:18px; letter-spacing:-.01em; display:flex; align-items:center; gap:10px; }
  .adv::before { content:""; width:4px; height:18px; border-radius:2px; background:var(--acc); }
  .li { border:1px solid var(--line); border-radius:var(--radius); margin:10px 0; background:var(--surface); box-shadow:var(--shadow); overflow:hidden; }
  .li > .hd { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:10px; flex-wrap:wrap; align-items:baseline; }
  .li > .hd b { font-weight:600; } .mute { color:var(--mute); font-size:13px; }
  .crs { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; padding:14px; }
  .cr { position:relative; border:1.5px solid var(--line); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:8px; cursor:pointer;
    background:var(--surface); transition:border-color .15s, box-shadow .15s, transform .15s; }
  .cr:hover:not(.off) { transform:translateY(-2px); box-shadow:var(--shadow); }
  .cr.sel { border-color:var(--acc); background:var(--acc-soft); }
  .cr.sel::after { content:"✓"; position:absolute; top:8px; right:8px; width:22px; height:22px; border-radius:50%; background:var(--acc); color:var(--acc-ink); display:grid; place-items:center; font-size:12px; font-weight:800; }
  .cr.off { opacity:.45; cursor:not-allowed; }
  .thumb { height:120px; display:flex; align-items:center; justify-content:center; border-radius:8px; overflow:hidden;
    background:repeating-conic-gradient(var(--surface-2) 0 25%, transparent 0 50%) 0 0/16px 16px; }
  .thumb img { max-width:100%; max-height:120px; }
  .cname { font-size:13px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tag { display:inline-block; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:99px; background:var(--surface-2); color:var(--mute); }
  .switch { display:inline-flex; align-items:center; gap:8px; font-size:13.5px; color:var(--mute); cursor:pointer; white-space:nowrap; user-select:none; }
  .switch input { display:none; }
  .switch span { width:34px; height:20px; border-radius:99px; background:var(--line); position:relative; transition:background .15s; }
  .switch span::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .15s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + span { background:var(--acc); } .switch input:checked + span::after { transform:translateX(14px); }
  .tag.up { background:color-mix(in srgb, #f59e0b 18%, transparent); color:#b45309; }
  [data-theme=dark] .tag.up { color:#fbbf24; }
  .tag.warn { background:var(--warn-bg); color:var(--warn-ink); }
  .tag.d { background:color-mix(in srgb, var(--dev-d) 14%, transparent); color:var(--dev-d); }
  .tag.m { background:color-mix(in srgb, var(--dev-m) 14%, transparent); color:var(--dev-m); }
  select { font:inherit; font-size:13px; color:var(--ink); background:var(--surface); padding:6px 8px; border-radius:8px; border:1px solid var(--line); }
  .pages { display:grid; grid-template-columns:1fr 1fr; gap:4px; max-height:260px; overflow:auto; margin:8px 0; font-size:14px; }
  .pages label { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:8px; cursor:pointer; }
  .pages label:hover { background:var(--surface-2); }
  input[type=checkbox] { accent-color:var(--acc); width:16px; height:16px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0; }
  .seg { display:inline-flex; padding:3px; gap:2px; background:var(--surface-2); border-radius:12px; }
  .seg button { border:0; background:transparent; border-radius:9px; padding:6px 14px; color:var(--mute); }
  .seg button.on { background:var(--surface); color:var(--ink); box-shadow:var(--shadow); font-weight:600; }
  .grow { flex:1; }
  .links { margin-top:12px; display:flex; flex-direction:column; gap:6px; }
  .links a { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line); border-radius:10px; color:var(--ink); text-decoration:none; transition:background .15s, border-color .15s; }
  .links a:hover { background:var(--surface-2); border-color:var(--acc); }
  .links .p { font-weight:600; font-size:13.5px; word-break:break-all; }
  .links .l { font-size:12px; color:var(--mute); }
  #login { max-width:380px; margin:14vh auto; }
  #login .brand { margin-bottom:16px; }
  .err { color:var(--acc); font-size:13.5px; min-height:1.2em; }
  .empty { padding:56px 20px; text-align:center; color:var(--mute); }
  ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-thumb { background:var(--line); border-radius:99px; border:2px solid var(--surface); }
</style>
</head>
<body>
<div id="login" class="panel" hidden>
  <div class="brand"><span class="logo">DN</span>Ad Preview</div>
  <form id="lf"><input type="password" id="pw" placeholder="รหัสผ่าน" autofocus>
  <div class="row"><button class="pri grow">เข้าสู่ระบบ</button></div><div class="err" id="lerr"></div></form>
</div>

<div id="app" hidden>
  <header><div class="brand"><span class="logo">DN</span>Ad Preview</div><span id="meta"></span><span class="sp"></span>
    <button id="refresh">↻ รีเฟรชจาก GAM</button>
    <button id="theme" class="icon" title="สลับโหมดสว่าง/มืด" aria-label="สลับโหมดสว่าง/มืด"></button></header>
  <main>
    <section>
      <div class="search"><div class="row" style="margin:0"><input type="search" id="q" class="grow" placeholder="ค้นหาลูกค้า / line item / creative" style="width:auto">
        <label class="switch"><input type="checkbox" id="upc"><span></span>รวมแคมเปญที่ยังไม่เริ่ม (30 วัน)</label></div></div>
      <div id="list"><div class="empty">กำลังโหลด…</div></div>
    </section>
    <aside><div class="panel">
      <div class="step"><span class="num">1</span>Creative ที่เลือก<span class="count" id="nsel">0</span></div>
      <div class="row"><button id="clearSel" class="ghost">ล้างที่เลือก</button></div>
      <div class="step"><span class="num">2</span>หน้าปลายทาง</div>
      <div class="row"><button id="allP" class="ghost">เลือกทั้งหมด</button><button id="noP" class="ghost">ล้าง</button></div>
      <div class="pages" id="pages"></div>
      <textarea id="custom" rows="3" placeholder="Custom: วาง URL หรือ path บรรทัดละ 1 เช่น /news/123456/"></textarea>
      <div class="step"><span class="num">3</span>อุปกรณ์</div>
      <div class="seg" id="dev"><button data-dev="desktop" class="on">🖥 Desktop</button><button data-dev="mobile">📱 Mobile</button><button data-dev="both">ทั้งคู่</button></div>
      <div class="row" style="margin-top:16px"><button class="pri grow" id="make">สร้างลิงก์</button><button id="openAll" disabled>เปิดทั้งหมด</button></div>
      <div class="err" id="aerr"></div>
      <div class="links" id="links"></div>
    </div></aside>
  </main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const SLOT_TH = { leaderboard: 'Leaderboard', sticky: 'Sticky', postarticle: 'Postarticle' };
let DATA = null, device = 'desktop', links = [];
const sel = new Map(); // key creativeId|lineItemId → { item, slot }

async function api(path, opts) {
  const r = await fetch(path, { credentials: 'same-origin', ...opts });
  if (r.status === 401) { showLogin(); throw new Error('unauthorized'); }
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
function showLogin() { $('#app').hidden = true; $('#login').hidden = false; $('#pw').focus(); }

$('#lf').onsubmit = async (e) => {
  e.preventDefault(); $('#lerr').textContent = '';
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('#pw').value }) });
  if (!r.ok) { $('#lerr').textContent = 'รหัสผ่านไม่ถูกต้อง'; return; }
  $('#login').hidden = true; load();
};

async function load(refresh) {
  $('#app').hidden = false;
  $('#list').innerHTML = '<div class="empty">กำลังดึงข้อมูลจาก GAM…</div>';
  try {
    DATA = await api('/api/creatives' + (refresh ? '?refresh=1' : ''));
  } catch (e) { if (e.message !== 'unauthorized') $('#list').innerHTML = `<div class="empty">ดึงข้อมูลไม่สำเร็จ: ${esc(e.message)}</div>`; return; }
  $('#meta').textContent = `วันที่ ${DATA.today} · อัปเดต ${new Date(DATA.fetchedAt).toLocaleTimeString('th-TH')}`;
  if (!$('#pages').children.length) renderPages();
  renderList();
}

function renderPages() {
  $('#pages').innerHTML = DATA.pages.map((p, i) =>
    `<label><input type="checkbox" value="${esc(p.path)}" data-cat="${esc(p.category || '')}" ${i === 0 ? 'checked' : ''}> ${esc(p.name)}</label>`).join('');
}

function renderList() {
  const q = $('#q').value.trim().toLowerCase();
  const showUp = $('#upc').checked;
  const items = DATA.items.filter((it) => (showUp || !it.upcoming) && (!q || [it.advertiser, it.lineItemName, it.creativeName, it.orderName].join(' ').toLowerCase().includes(q)));
  if (!items.length) { $('#list').innerHTML = `<div class="empty">ไม่พบ creative ที่ Active วันนี้${showUp ? ' หรือที่จะเริ่มใน 30 วัน' : ''}</div>`; return; }
  const byAdv = new Map();
  for (const it of items) {
    if (!byAdv.has(it.advertiser)) byAdv.set(it.advertiser, new Map());
    const m = byAdv.get(it.advertiser);
    if (!m.has(it.lineItemId)) m.set(it.lineItemId, []);
    m.get(it.lineItemId).push(it);
  }
  let h = '';
  for (const [adv, lis] of byAdv) {
    h += `<div class="adv">${esc(adv)}</div>`;
    for (const [, crs] of lis) {
      const li = crs[0];
      h += `<div class="li"><div class="hd"><b>${esc(li.lineItemName)}</b>${li.upcoming ? `<span class="tag up">เริ่ม ${esc(thDate(li.start))}</span>` : ''}<span class="mute">${esc(li.orderName)} · ${esc(li.start || '')} → ${esc(li.end || 'ไม่สิ้นสุด')} · ${esc(li.lineItemStatus)}</span></div><div class="crs">`;
      for (const it of crs) {
        const key = it.creativeId + '|' + it.lineItemId;
        const s = sel.get(key);
        const slot = s ? s.slot : it.slots[0];
        const slotOpts = (it.slotGuessed ? Object.keys(SLOT_TH) : it.slots)
          .map((x) => `<option value="${x}" ${x === slot ? 'selected' : ''}>${SLOT_TH[x]}</option>`).join('');
        h += `<div class="cr ${s ? 'sel' : ''} ${it.supported ? '' : 'off'}" data-key="${esc(key)}">
          <div class="thumb">${it.type === 'img' ? `<img src="${esc(it.url)}" loading="lazy" alt="">` : `<span class="mute">${it.type === 'html5' ? 'HTML5' : 'ไม่รองรับ'}</span>`}</div>
          <div class="cname" title="${esc(it.creativeName)}">${esc(it.creativeName)}</div>
          <div><span class="tag">${it.w}×${it.h}</span> ${it.slotGuessed ? '<span class="tag warn">เลือก slot เอง</span>' : ''}</div>
          ${it.supported ? `<select data-slot="${esc(key)}">${slotOpts}</select>` : ''}
        </div>`;
      }
      h += '</div></div>';
    }
  }
  $('#list').innerHTML = h;
}

$('#list').addEventListener('click', (e) => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'OPTION') return;
  const card = e.target.closest('.cr'); if (!card || card.classList.contains('off')) return;
  const key = card.dataset.key;
  if (sel.has(key)) sel.delete(key);
  else {
    const it = DATA.items.find((x) => x.creativeId + '|' + x.lineItemId === key);
    sel.set(key, { item: it, slot: card.querySelector('select').value });
    // ติ๊กหน้าหมวดตาม targeting ของ line item
    for (const c of it.categories || []) { const cb = $(`#pages input[data-cat="${c}"]`); if (cb) cb.checked = true; }
  }
  card.classList.toggle('sel', sel.has(key));
  setCount();
});
$('#list').addEventListener('change', (e) => {
  const key = e.target.dataset.slot; if (!key) return;
  if (sel.has(key)) sel.get(key).slot = e.target.value;
});
$('#q').oninput = renderList;
$('#upc').onchange = () => {
  if (!$('#upc').checked) for (const [k, v] of sel) if (v.item.upcoming) sel.delete(k); // ไม่ให้ค้างตัวที่ซ่อน
  setCount(); renderList();
};
function thDate(ymd) { try { return new Date(ymd + 'T00:00:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }); } catch { return ymd; } }
$('#refresh').onclick = () => load(true);
$('#clearSel').onclick = () => { sel.clear(); setCount(); renderList(); };
function setCount() { $('#nsel').textContent = sel.size; $('#nsel').classList.toggle('on', sel.size > 0); }
function paintTheme() { $('#theme').textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙'; }
$('#theme').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; try { localStorage.setItem('dnap-theme', t); } catch (e) {}
  paintTheme();
};
paintTheme();
$('#allP').onclick = () => document.querySelectorAll('#pages input').forEach((c) => (c.checked = true));
$('#noP').onclick = () => document.querySelectorAll('#pages input').forEach((c) => (c.checked = false));
document.querySelectorAll('.seg button').forEach((b) => (b.onclick = () => {
  device = b.dataset.dev; document.querySelectorAll('.seg button').forEach((x) => x.classList.toggle('on', x === b));
}));

function targetUrls() {
  const site = DATA.site.replace(/\/$/, '');
  const out = [...document.querySelectorAll('#pages input:checked')].map((c) => site + c.value);
  for (let line of $('#custom').value.split('\n')) {
    line = line.trim(); if (!line) continue;
    if (line.startsWith('/')) out.push(site + line);
    else { try { const u = new URL(line); if (u.hostname.endsWith('dailynews.co.th')) out.push(u.origin + u.pathname + u.search); } catch {} }
  }
  return [...new Set(out)];
}

// แบ่ง creative ที่เลือกเป็นชุด โดย 1 ชุดมีได้ไม่เกิน 1 creative ต่อ slot
function groups() {
  const sets = [];
  for (const { item, slot } of sel.values()) {
    let g = sets.find((s) => !s.some((x) => x.slot === slot));
    if (!g) sets.push((g = []));
    g.push({ slot, item });
  }
  return sets;
}

$('#make').onclick = async () => {
  $('#aerr').textContent = ''; $('#links').innerHTML = ''; links = []; $('#openAll').disabled = true;
  const urls = targetUrls(), sets = groups();
  if (!sets.length) return ($('#aerr').textContent = 'ยังไม่ได้เลือก creative');
  if (!urls.length) return ($('#aerr').textContent = 'ยังไม่ได้เลือกหน้าปลายทาง');
  try {
    for (const g of sets) {
      const { token } = await api('/api/sign', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: g.map(({ slot, item }) => ({ slot, type: item.type, w: item.w, h: item.h, url: item.url, clickUrl: item.clickUrl })) }) });
      const label = g.map((x) => `${SLOT_TH[x.slot]}: ${x.item.creativeName}`).join(' + ');
      const devs = device === 'both' ? ['desktop', 'mobile'] : [device];
      for (const u of urls) for (const dev of devs)
        links.push({ href: u + (u.includes('?') ? '&' : '?') + 'dn_mock=' + encodeURIComponent(token), label, page: u, dev });
    }
  } catch (e) { $('#aerr').textContent = 'สร้างลิงก์ไม่สำเร็จ: ' + e.message; return; }
  $('#links').innerHTML = links.map((l, i) => `<a href="${esc(l.href)}" data-i="${i}" target="_blank" rel="noopener">
      <span class="tag ${l.dev === 'mobile' ? 'm' : 'd'}">${l.dev === 'mobile' ? '📱 Mobile' : '🖥 Desktop'}</span>
      <span><div class="p">${esc(l.page.replace(/^https:\/\/[^/]+/, '') || '/')}</div><div class="l">${esc(l.label)}</div></span></a>`).join('');
  $('#openAll').disabled = false;
};

function openLink(l, i) {
  if (l.dev === 'mobile') return window.open(l.href, 'dnap' + i, 'width=390,height=844');
  return window.open(l.href, '_blank');
}
$('#links').addEventListener('click', (e) => {
  const a = e.target.closest('a'); if (!a) return;
  const l = links[+a.dataset.i]; if (!l || l.dev !== 'mobile') return;
  e.preventDefault(); openLink(l, a.dataset.i);
});
$('#openAll').onclick = () => {
  let blocked = 0;
  links.forEach((l, i) => { if (!openLink(l, i)) blocked++; });
  if (blocked) $('#aerr').textContent = `เบราว์เซอร์บล็อก ${blocked} หน้า — กดอนุญาต pop-up ของเว็บนี้ แล้วกดอีกครั้ง`;
};

load();
</script>
</body>
</html>
